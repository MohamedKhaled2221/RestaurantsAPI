name: Build, Test & Deploy — Restaurant API

on:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'Restaurants.API/Restaurants.API.csproj'
  TEST_PROJECT_PATH: 'RestaurantAPI.Tests/RestaurantAPI.Tests.csproj'
  PUBLISH_DIR: './publish'
  AZURE_WEBAPP_NAME: your-azure-app-name   # 👈 غير دا لاسم الـ App Service بتاعك

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Test
  # ─────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 🔨 Build solution
        run: dotnet build --configuration Release --no-restore

      - name: 🧪 Run tests
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-build --verbosity normal

  # ─────────────────────────────────────────
  # JOB 2: Publish & Deploy
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test        # لا يشتغل إلا لو الـ build والـ tests نجحوا

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 📁 Publish application
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ${{ env.PUBLISH_DIR }} --no-restore

      - name: 🚀 Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
